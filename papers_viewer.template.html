<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>论文速览 · Papers Digest</title>
<link rel="icon" href="data:,">
<style>
  /* 浅色是 :root 默认值。暗色调色板见下面两处：显式 theme-dark 与
     auto+系统暗色。theme-light 永远只吃这里的默认值，不被 @media 改写。 */
  :root {
    color-scheme: light dark;
    --bg: #f5f7f8;
    --panel: #ffffff;
    --ink: #172026;
    --muted: #5d6972;
    --line: #d9e0e4;
    --accent: #0f766e;
    --accent-ink: #ffffff;
    --accent-soft: #e7f4f1;
    --accent-soft-ink: #0b5b54;
    --accent-soft-line: #bfe3dc;
    --link: #2459a6;
    --star: #d97706;
    --star-on-bg: #fdf6ea;
    --shadow: 0 12px 28px rgba(23, 32, 38, 0.08);
    --topbar-bg: rgba(245, 247, 248, 0.94);
    --btn-ok-bg: #e8eefb;
    --btn-ok-line: #c3d2f0;
    --btn-ok-ink: #2a4a8f;
    --warn-bg: #fdf3e3;
    --warn-line: #f0d6a8;
    --warn-ink: #8a5a09;
    --mark-bg: #fde68a;
    --sep: #c3ccd2;
    --star-idle: #b9c2c8;
    --actionbar-bg: #172026;
    --actionbar-shadow: 0 14px 34px rgba(23, 32, 38, 0.3);
    --scrim: rgba(0, 0, 0, 0);
  }

  /* 暗色调色板 —— 显式 theme-dark 直接锁暗色，无视系统偏好。
     色值与下面 @media 里的 auto 块保持一致，改动两处要同步。 */
  html.theme-dark {
    color-scheme: dark;
    --bg: #0f1417;
    --panel: #181f24;
    --ink: #e6ecef;
    --muted: #93a0a8;
    --line: #2a343b;
    --accent: #2dd4bf;
    --accent-ink: #06231f;
    --accent-soft: #1c3a36;
    --accent-soft-ink: #5eead4;
    --accent-soft-line: #285e57;
    --link: #7cb0ff;
    --star: #fbbf24;
    --star-on-bg: #3a2e10;
    --shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
    --topbar-bg: rgba(15, 20, 23, 0.85);
    --btn-ok-bg: #1a2742;
    --btn-ok-line: #2c3d63;
    --btn-ok-ink: #93b4ff;
    --warn-bg: #2f2615;
    --warn-line: #4a3a1d;
    --warn-ink: #fbbf24;
    --mark-bg: #5a4a14;
    --sep: #3a444b;
    --star-idle: #4a555c;
    --actionbar-bg: #e6ecef;
    --actionbar-shadow: 0 14px 34px rgba(0, 0, 0, 0.55);
    --scrim: rgba(0, 0, 0, 0.3);
  }

  /* 自动模式：系统偏好为暗色时切暗色。显式 theme-light 不带 .theme-auto，
     所以即便系统是暗色，也吃不到这里的覆盖，保持浅色。 */
  @media (prefers-color-scheme: dark) {
    html.theme-auto {
      color-scheme: dark;
      --bg: #0f1417;
      --panel: #181f24;
      --ink: #e6ecef;
      --muted: #93a0a8;
      --line: #2a343b;
      --accent: #2dd4bf;
      --accent-ink: #06231f;
      --accent-soft: #1c3a36;
      --accent-soft-ink: #5eead4;
      --accent-soft-line: #285e57;
      --link: #7cb0ff;
      --star: #fbbf24;
      --star-on-bg: #3a2e10;
      --shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
      --topbar-bg: rgba(15, 20, 23, 0.85);
      --btn-ok-bg: #1a2742;
      --btn-ok-line: #2c3d63;
      --btn-ok-ink: #93b4ff;
      --warn-bg: #2f2615;
      --warn-line: #4a3a1d;
      --warn-ink: #fbbf24;
      --mark-bg: #5a4a14;
      --sep: #3a444b;
      --star-idle: #4a555c;
      --actionbar-bg: #e6ecef;
      --actionbar-shadow: 0 14px 34px rgba(0, 0, 0, 0.55);
      --scrim: rgba(0, 0, 0, 0.3);
    }
  }

  html.theme-light { color-scheme: light; }
  /* theme-auto：跟随系统偏好；默认浅色，系统暗色时由上面 @media 接管 */

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    min-width: 320px;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
  }
  a { color: var(--link); text-decoration-thickness: 0.08em; text-underline-offset: 0.18em; }
  button { font: inherit; cursor: pointer; }

  .shell {
    width: min(1440px, 100%);
    margin: 0 auto;
    padding: 18px clamp(12px, 2.4vw, 32px) 96px;
  }

  /* ---------- 顶栏 ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    margin: -18px calc(clamp(12px, 2.4vw, 32px) * -1) 18px;
    padding: 14px clamp(12px, 2.4vw, 32px) 12px;
    background: var(--topbar-bg);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .topline {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand h1 { margin: 0; font-size: clamp(19px, 2.4vw, 25px); letter-spacing: -0.01em; }
  .digest-nav { display: inline-flex; gap: 4px; margin-bottom: 10px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .digest-nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 4px 19px; border-radius: 7px; text-decoration: none; color: var(--muted); font-size: 14px; font-weight: 600; }
  .digest-nav a[aria-current] { color: var(--accent-soft-ink); background: var(--accent-soft); }
  .brand .sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .stat-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 11px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--line);
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
  }
  .stat-pill b { color: var(--ink); font-weight: 600; }
  .stat-pill.ok { background: var(--accent-soft); border-color: var(--accent-soft-line); color: var(--accent-soft-ink); }
  .stat-pill.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-ink); }

  .controls {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search {
    flex: 1 1 320px;
    min-width: 220px;
    padding: 9px 13px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    font-size: 14px;
    color: var(--ink);
  }
  .search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
  .seg button {
    border: 0;
    background: transparent;
    padding: 8px 12px;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: var(--accent-ink); }

  /* ---------- 布局 ---------- */
  .content {
    display: grid;
    grid-template-columns: 236px minmax(0, 1fr);
    gap: 20px;
    align-items: start;
  }
  .sidebar { position: sticky; top: calc(var(--header-height, 180px) + 16px); display: flex; flex-direction: column; gap: 14px; }
  .side-block {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 13px;
    box-shadow: var(--shadow);
  }
  .side-block h2 {
    margin: 0 0 8px;
    font-size: 11.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  .side-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    border: 0;
    background: transparent;
    padding: 5px 7px;
    border-radius: 7px;
    font-size: 13px;
    color: var(--ink);
    text-align: left;
  }
  .side-item:hover { background: var(--accent-soft); }
  .side-item.on { background: var(--accent-soft); color: var(--accent-soft-ink); font-weight: 600; }
  .side-item .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .side-item.on .n { color: var(--accent-soft-ink); }

  /* ---------- 卡片 ---------- */
  .day-heading {
    margin: 22px 0 10px;
    font-size: 14px;
    color: var(--muted);
    font-weight: 600;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }
  .day-heading:first-child { margin-top: 0; }

  .article {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    break-inside: avoid;
  }
  .card-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    flex-wrap: wrap;
    font-size: 12.5px;
    color: var(--muted);
  }
  .pick { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
  .star {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--star-idle);
    border-radius: 8px;
    padding: 1px 8px;
    font-size: 15px;
    line-height: 1.5;
  }
  .star:hover { border-color: var(--star); color: var(--star); }
  .star.on { color: var(--star); border-color: var(--star); background: var(--star-on-bg); }
  .journal-badge {
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent-soft-ink);
    font-weight: 600;
    font-size: 11.5px;
  }
  .sep { color: var(--sep); }

  .titles { margin: 0 0 8px; }
  .title-cn, .title-fallback {
    margin: 0;
    font-size: 16.5px;
    line-height: 1.45;
    font-weight: 650;
    letter-spacing: -0.005em;
  }
  .title-en {
    margin: 3px 0 0;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.45;
  }
  .abstracts { font-size: 13.5px; }
  .abs-zh, .abs-fallback { margin: 0; line-height: 1.7; }
  .abs-en {
    margin: 8px 0 0;
    padding-left: 11px;
    border-left: 2px solid var(--line);
    color: var(--muted);
    font-size: 12.5px;
    line-height: 1.6;
  }
  .clamped { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }

  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .btn {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--muted);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 12.5px;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { color: var(--accent-ink); filter: brightness(1.08); }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .btn.done { background: var(--btn-ok-bg); border-color: var(--btn-ok-line); color: var(--btn-ok-ink); }
  .btn.done:disabled { opacity: 1; }

  .empty { padding: 48px 0; text-align: center; color: var(--muted); }

  /* ---------- 语言显示 ----------
     title-fallback / abs-fallback 用于「没有中文译文」的条目，
     它们承载的是英文原文，所以在任何语言模式下都不能被隐藏。 */
  body.lang-en .title-cn, body.lang-en .abs-zh { display: none; }
  body.lang-zh .title-en, body.lang-zh .abs-en { display: none; }

  /* ---------- 底部操作栏 ---------- */
  .actionbar {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translate(-50%, 140%);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--actionbar-bg);
    color: var(--bg);
    border-radius: 999px;
    box-shadow: var(--actionbar-shadow);
    font-size: 13.5px;
    transition: transform 0.2s ease;
    z-index: 30;
  }
  .actionbar.show { transform: translate(-50%, 0); }
  .actionbar .btn {
    background: var(--scrim);
    border-color: var(--line);
    color: inherit;
  }
  .actionbar .btn:hover { background: var(--accent-soft); color: var(--accent-soft-ink); }
  .actionbar .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  mark { background: var(--mark-bg); color: inherit; padding: 0 1px; border-radius: 2px; }
  .update-note, .filter-note { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
  .update-note.warn { color: var(--warn-ink); }
  .title-row { display: flex; gap: 18px; align-items: flex-start; }
  .title-row .titles { flex: 1; min-width: 0; }
  .browse-toggle {
    flex-shrink: 0; min-width: 132px; min-height: 44px; padding: 10px 16px;
    border: 1px solid var(--accent); border-radius: 9px; font-size: 15px;
    font-weight: 600; background: var(--accent); color: var(--accent-ink);
  }
  .browse-toggle.on { background: var(--accent-soft); color: var(--accent-soft-ink); border-color: var(--accent-soft-line); }
  .browse-toggle:disabled { cursor: default; }
  .abstract-status { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  .abstract-status.warn { color: var(--warn-ink); }
  .update-actions { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .update-progress { color: var(--muted); font-size: 12px; }
  .date-range { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px; }
  .date-range[hidden] { display: none; }
  .date-range label { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
  .date-range input { min-height: 44px; max-width: 170px; padding: 6px 9px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; }
  .date-range p { flex-basis: 100%; margin: 0; color: var(--muted); font-size: 12px; }
  html.theme-dark .date-range input { color-scheme: dark; }
  @media (prefers-color-scheme: dark) { html.theme-auto .date-range input { color-scheme: dark; } }
  .day-heading { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .article:not(.open) .abstracts { display: none; }
  .compact .article { padding: 11px 16px; }
  .compact .article:not(.open) .authors { display: none; }
  .detail-toggle { display: inline-block; }
  .empty-state { padding: 36px 20px; color: var(--muted); text-align: center; }
  .actionbar { flex-wrap: wrap; max-width: calc(100% - 24px); }

  @media (max-width: 860px) {
    .content { grid-template-columns: 1fr; }
    .sidebar { position: static; }
    .topbar { position: static; margin-top: 0; }
  }
  @media (max-width: 600px) {
    .title-row { flex-direction: column; gap: 6px; }
    .browse-toggle { align-self: flex-start; }
  }

  @media print {
    .topbar, .sidebar, .actionbar, .actions, .pick, .star, .browse-toggle { display: none !important; }
    .article { box-shadow: none; border-color: #ccc; }
    .clamped { -webkit-line-clamp: unset; display: block; }
  }
</style>
</head>
<body class="lang-both">
<script>
  // 主题类尽早挂到 <html>，避免首屏闪一下亮色再切到暗色
  (function () {
    var t = "auto";
    try { t = localStorage.getItem("papers-digest-theme") || "auto"; } catch (e) {}
    if (t !== "light" && t !== "dark" && t !== "auto") t = "auto";
    document.documentElement.classList.add("theme-" + t);
  })();
</script>

<div class="shell">
  <header class="topbar">
    <div class="topline">
      <div class="brand">
        <nav class="digest-nav" aria-label="阅读入口"><a href="papers-digest.html" aria-current="page">论文</a><a href="news-digest.html">新闻</a></nav>
        <h1>论文速览</h1>
        <p class="sub">默认近 __DAYS__ 天 · 历史共 __COUNT__ 篇 · 页面生成于 __GENERATED__</p>
        <p class="update-note" id="updateNote"></p>
        <div class="update-actions">
          <button class="btn primary" id="updateButton">更新文献</button>
          <span class="update-progress" id="updateProgress" role="status">只翻译新标题 · 摘要点开后按需翻译</span>
        </div>
      </div>
      <div class="stats">
        <span class="stat-pill" id="visibleCount">…</span>
        <span class="stat-pill" id="starCount">★ 0</span>
        <span class="stat-pill" id="serverPill">检测本地服务…</span>
      </div>
    </div>
    <div class="controls">
      <input class="search" id="search" type="search"
             placeholder="搜索标题 / 摘要 / 作者 / DOI —— 中英文都能搜">
      <div class="seg" id="langSeg">
        <button data-lang="both" class="on">中英对照</button>
        <button data-lang="zh">仅中文</button>
        <button data-lang="en">仅英文</button>
      </div>
      <div class="seg" id="daySeg">
        <button data-days="7">近 7 天</button>
        <button data-days="30" class="on">近 30 天</button>
        <button data-days="0">全部历史</button>
        <button data-days="custom" id="dateRangeButton" aria-expanded="false" aria-controls="dateRange">选择日期</button>
      </div>
      <div class="seg" id="viewSeg">
        <button data-view="all" class="on">全部文章</button>
        <button data-view="new">上次访问后新增</button>
        <button data-view="unread">未浏览</button>
        <button data-view="browsed">已浏览</button>
        <button data-view="full">已读全文</button>
        <button data-view="starred">★ 想读</button>
      </div>
      <div class="seg" id="densitySeg">
        <button data-density="compact" class="on">紧凑列表</button>
        <button data-density="cards">摘要卡片</button>
      </div>
      <div class="seg" id="themeSeg" title="切换主题">
        <button data-theme="auto" class="on">自动</button>
        <button data-theme="light">浅色</button>
        <button data-theme="dark">深色</button>
      </div>
    </div>
    <div class="date-range" id="dateRange" hidden>
      <label>按月选择 <input id="monthPicker" type="month" aria-label="按月选择"></label>
      <label>开始日期 <input id="startDate" type="date" aria-label="开始日期"></label>
      <label>结束日期 <input id="endDate" type="date" aria-label="结束日期"></label>
      <p id="dateRangeHint" role="status">可选整月或任意日期范围（含起止日）。选择后先查看已收录论文；点击「更新文献」抓取该范围所有期刊的论文。</p>
    </div>
    <p class="filter-note" id="filterNote"></p>
  </header>

  <div class="content">
    <aside class="sidebar">
      <div class="side-block"><h2>期刊</h2><div id="journalList"></div></div>
    </aside>
    <main id="list"></main>
  </div>
</div>

<div class="actionbar" id="actionbar">
  <span id="pickCount">已选 0 篇</span>
  <button class="btn" data-act="bibtex">导出 BibTeX</button>
  <button class="btn" data-act="browsed">标为已浏览</button>
  <button class="btn" data-act="full">标为已读全文</button>
  <button class="btn" data-act="clear">清空</button>
</div>

<script id="article-data" type="application/json">__DATA__</script>
<script id="digest-meta" type="application/json">__META__</script>
<script>
(function () {
  "use strict";

  var ARTICLES = JSON.parse(document.getElementById("article-data").textContent);
  var META = JSON.parse(document.getElementById("digest-meta").textContent);
  var TRANSLATED = __TRANSLATED__;
  var DEFAULT_DAYS = __DAYS__;
  var DAY_MS = 86400000;
  var CHUNK = 60;
  var STORE_KEY = "papers-digest-starred";
  var THEME_KEY = "papers-digest-theme";
  var READING_KEY = "papers-digest-reading";
  var VISIT_KEY = "papers-digest-last-visit";
  var openedAt = new Date().toISOString();
  var hasLocalMarks = false;
  var newSince = META.previousSuccessAt || META.lastSuccessAt || openedAt;
  var firstVisit = true;
  try {
    hasLocalMarks = localStorage.getItem(STORE_KEY) !== null;
    var previousVisit = localStorage.getItem(VISIT_KEY);
    if (previousVisit && !isNaN(Date.parse(previousVisit))) {
      newSince = previousVisit;
      firstVisit = false;
    }
  } catch (e) {}
  var SERVER = false;   // 本地服务在不在
  var updateTimer = null;
  var updateStartedAt = "";
  var updateScopeStartedAt = "";
  var updateButton = document.getElementById("updateButton");
  var updateProgress = document.getElementById("updateProgress");
  var dateRange = document.getElementById("dateRange");
  var startDateInput = document.getElementById("startDate");
  var endDateInput = document.getElementById("endDate");
  var monthPicker = document.getElementById("monthPicker");
  var dateRangeHint = document.getElementById("dateRangeHint");
  var todayLocal = localDate(new Date());
  startDateInput.max = endDateInput.max = todayLocal;
  monthPicker.max = todayLocal.slice(0, 7);

  var list = document.getElementById("list");
  var searchBox = document.getElementById("search");
  var actionbar = document.getElementById("actionbar");
  var visibleCount = document.getElementById("visibleCount");
  var starCount = document.getElementById("starCount");
  var serverPill = document.getElementById("serverPill");
  var pickCount = document.getElementById("pickCount");

  function loadSet(key) {
    try {
      return new Set(JSON.parse(localStorage.getItem(key) || "[]"));
    } catch (e) {
      return new Set();
    }
  }
  function saveSet(key, set) {
    try {
      localStorage.setItem(key, JSON.stringify(Array.from(set)));
    } catch (e) { /* file:// 下可能被禁用，忽略 */ }
  }

  var state = {
    query: "",
    journal: "all",
    days: DEFAULT_DAYS,
    startDate: "",
    endDate: "",
    lang: "both",
    view: "all",
    theme: "auto",  // auto | light | dark
    starred: loadSet(STORE_KEY),
    selected: new Set(),
    reading: {},
    density: "compact"
  };
  try { state.reading = JSON.parse(localStorage.getItem(READING_KEY) || "{}"); } catch (e) {}
  if (!state.reading || Array.isArray(state.reading) || typeof state.reading !== "object") state.reading = {};

  ARTICLES.forEach(function (a) {
    if (a.starred && !hasLocalMarks) state.starred.add(a.doi);
    if (a.reading) { var entry = {}; entry[a.doi] = a.reading; mergeReading(entry); }
  });

  function mergeReading(records) {
    Object.keys(records || {}).forEach(function (doi) {
      var next = records[doi], old = state.reading[doi];
      if (!next || ["unread", "browsed", "full"].indexOf(next.status) === -1 || isNaN(Date.parse(next.updatedAt))) return;
      if (!old || Date.parse(next.updatedAt) > Date.parse(old.updatedAt)) state.reading[doi] = next;
    });
  }
  function readingStatus(doi) { return (state.reading[doi] || {}).status || "unread"; }
  function saveReadingLocal() {
    try { localStorage.setItem(READING_KEY, JSON.stringify(state.reading)); } catch (e) {}
  }
  function showUpdate(metadata) {
    var note = document.getElementById("updateNote");
    var last = metadata.lastSuccessAt || META.lastSuccessAt;
    note.textContent = (last ? "最近成功更新：" + new Date(last).toLocaleString("zh-CN", {hour12: false}) + " · " : "") +
      (metadata.state === "failed" ? "更新失败，已保留上次数据" : metadata.state === "partial" ? "部分更新失败，保留历史数据" : "更新成功 · 本次新增 " + (metadata.added || 0) + " 篇");
    if (metadata.startDate && metadata.endDate) note.textContent += " · 抓取范围：" + metadata.startDate + " 至 " + metadata.endDate;
    if ((metadata.failedJournals || []).length) note.textContent += " · 失败期刊：" + metadata.failedJournals.join("、");
    note.classList.toggle("warn", metadata.state === "failed" || metadata.state === "partial");
  }

  var filtered = [];
  var rendered = 0;
  var sentinel = null;

  // ---------------------------------------------------------------- 工具
  var ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return ESC[c]; });
  }
  function highlight(text, q) {
    text = text || "";
    if (!q) return esc(text);
    var lower = text.toLowerCase(), ql = q.toLowerCase(), out = "", i = 0, idx;
    while ((idx = lower.indexOf(ql, i)) !== -1) {
      out += esc(text.slice(i, idx)) + "<mark>" + esc(text.slice(idx, idx + ql.length)) + "</mark>";
      i = idx + ql.length;
    }
    return out + esc(text.slice(i));
  }
  function authorLine(a) {
    var names = (a.authors || []).map(function (x) {
      return x.family ? (x.given ? x.given + " " + x.family : x.family) : x.given;
    }).filter(Boolean);
    if (!names.length) return "";
    if (names.length <= 3) return names.join(", ");
    return names.slice(0, 3).join(", ") + " 等 " + names.length + " 位作者";
  }
  function daysAgo(iso) {
    if (!iso) return Infinity;
    var t = Date.parse(iso);
    var now = new Date();
    return isNaN(t) ? Infinity : (Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - t) / DAY_MS;
  }

  // ---------------------------------------------------------------- 过滤
  function matches(a, ignoreJournal) {
    if (ignoreJournal !== true && state.journal !== "all" && a.journal !== state.journal) return false;
    if (state.view === "starred" && !state.starred.has(a.doi)) return false;
    if (state.view === "new" && !(Date.parse(a.firstSeenAt) > Date.parse(newSince))) return false;
    if (state.view === "unread" && readingStatus(a.doi) !== "unread") return false;
    if (state.view === "browsed" && readingStatus(a.doi) === "unread") return false;
    if (state.view === "full" && readingStatus(a.doi) !== "full") return false;
    if (state.startDate && (a.published < state.startDate || a.published > state.endDate)) return false;
    if (!state.startDate && state.days && daysAgo(a.published) > state.days) return false;
    if (state.query) {
      var hay = [
        a.title, a.titleCn, a.abstract, a.abstractCn, a.doi, a.journalName,
        (a.authors || []).map(function (x) { return (x.given || "") + " " + (x.family || ""); }).join(" ")
      ].join(" ").toLowerCase();
      var terms = state.query.toLowerCase().split(/\s+/).filter(Boolean);
      for (var i = 0; i < terms.length; i++) {
        if (hay.indexOf(terms[i]) === -1) return false;
      }
    }
    return true;
  }

  // ---------------------------------------------------------------- 渲染
  function abstractBlock(a) {
    var cn = a.abstractCn || "", en = a.abstract || "";
    var body = "";
    if (cn) {
      body += '<p class="abs-zh clamped">' + highlight(cn, state.query) + "</p>";
      if (en) body += '<p class="abs-en clamped">' + highlight(en, state.query) + "</p>";
    } else if (en) {
      // 没有中文译文时，英文原文是主角，用不会被语言开关隐藏的 fallback 类
      body += '<p class="abs-fallback clamped">' + highlight(en, state.query) + "</p>";
    } else if (!a.abstractLoading) {
      body += '<p class="abs-fallback">暂未找到摘要</p>';
    }
    if (Math.max(cn.length, en.length) > 300) {
      body += '<div class="actions"><button class="btn" data-act="expand">展开摘要</button></div>';
    }
    if (a.abstractLoading) body += '<p class="abstract-status" role="status">' + (en ? "正在翻译摘要…" : "正在查找并翻译摘要…") + '</p>';
    if (a.abstractError) body += '<p class="abstract-status warn">' + esc(a.abstractError) +
      ' <button class="btn" data-act="retry-abstract">重试</button></p>';
    return '<div class="abstracts">' + body + "</div>";
  }

  function cardEl(a) {
    var el = document.createElement("article");
    el.className = "article";
    el.dataset.doi = a.doi;

    var starred = state.starred.has(a.doi) ? " on" : "";
    var picked = state.selected.has(a.doi) ? " checked" : "";
    var meta = [];
    meta.push('<span class="journal-badge">' + esc(a.journal) + "</span>");
    meta.push("<span>" + esc(a.published || "") + "</span>");
    var vol = a.volume ? "V" + esc(a.volume) : "";
    if (a.issue) vol += " I" + esc(a.issue);
    if (vol) meta.push("<span>" + vol + "</span>");
    if (a.page) meta.push("<span>" + esc(a.page) + "</span>");
    if (a.abstractSource === "openalex") meta.push('<span title="Crossref 未提供摘要，取自 OpenAlex">OA</span>');

    var titleHtml = a.titleCn
      ? '<h3 class="title-cn">' + highlight(a.titleCn, state.query) + "</h3>" +
        '<p class="title-en">' + highlight(a.title, state.query) + "</p>"
      : '<h3 class="title-fallback">' + highlight(a.title, state.query) + "</h3>";

    var authors = authorLine(a);
    var transBtn = a.titleCn ? "" :
      '<button class="btn" data-act="translate-title">翻译标题</button>';
    var status = readingStatus(a.doi);


    el.innerHTML =
      '<div class="card-head">' +
        '<input type="checkbox" class="pick" data-act="pick"' + picked + ' title="选中以导出">' +
        '<button class="star' + starred + '" data-act="star" title="标记想读">★</button>' +
        meta.join('<span class="sep">·</span>') +
      "</div>" +
      '<div class="title-row"><div class="titles">' + titleHtml + "</div>" +
        '<button class="browse-toggle' + (status !== "unread" ? " on" : "") +
        '" data-act="browse" aria-pressed="' + (status !== "unread") + '"' +
        (status === "full" ? " disabled" : "") + ' title="' +
        (status === "browsed" ? "点击恢复未浏览" : "标记为已浏览") + '">' +
        (status === "full" ? "✓ 已读全文" : status === "browsed" ? "✓ 已浏览" : "标为已浏览") + "</button></div>" +
      (authors ? '<p class="title-en authors" style="font-size:12.5px">' + esc(authors) + "</p>" : "") +
      abstractBlock(a) +
      '<div class="actions">' +
        '<button class="btn detail-toggle" data-act="details">显示摘要</button>' +
        transBtn +
        '<a class="btn" href="' + esc(a.url) + '" target="_blank" rel="noopener">原文 / DOI</a>' +
        '<button class="btn" data-act="bibtex-one">复制 BibTeX</button>' +
        '<button class="btn" data-act="full-reading">' +
          (status === "full" ? "撤销已读全文" : "标为已读全文") + '</button>' +
      "</div>";

    return el;
  }

  function renderChunk() {
    var slice = filtered.slice(rendered, rendered + CHUNK);
    if (!slice.length) return;
    var frag = document.createDocumentFragment();
    var lastDay = rendered > 0 ? (filtered[rendered - 1].published || "").slice(0, 10) : "";
    slice.forEach(function (a) {
      var day = (a.published || "").slice(0, 10);
      if (day !== lastDay) {
        var h = document.createElement("h2");
        h.className = "day-heading";
        h.dataset.day = day;
        h.innerHTML = '<span>' + esc(day) + '</span><button class="btn" data-act="day-browsed" data-day="' +
          esc(day) + '">这一天标为已浏览</button>';
        frag.appendChild(h);
        lastDay = day;
      }
      frag.appendChild(cardEl(a));
    });
    list.appendChild(frag);
    rendered += slice.length;
  }

  function rebuild() {
    filtered = ARTICLES.filter(matches);
    list.textContent = "";
    rendered = 0;
    renderChunk();
    if (!filtered.length) {
      list.innerHTML = '<p class="empty-state">' + (state.startDate
        ? '该范围暂无符合条件的已收录论文。点击「更新文献」抓取所选日期的论文，也可清除搜索／期刊筛选。'
        : '没有符合条件的论文。可以切换到“全部历史”，或清除搜索／期刊筛选。') + '</p>';
    }
    updateCounts();
  }

  function updateCounts() {
    visibleCount.innerHTML = "显示 <b>" + filtered.length + "</b> / " + ARTICLES.length + " 篇";
    starCount.innerHTML = "★ <b>" + state.starred.size + "</b>";
    renderSidebar();
    actionbar.classList.toggle("show", state.selected.size > 0);
    pickCount.textContent = "已选 " + state.selected.size + " 篇";
    var scope = state.startDate ? state.startDate + " 至 " + state.endDate : state.days ? "近 " + state.days + " 天" : "全部历史";
    document.getElementById("filterNote").textContent = "当前范围：" + scope +
      (state.journal === "all" ? "" : " · " + state.journal) +
      (state.view === "new" ? " · " + (firstVisit ? "首次使用，显示本次更新新增" : "新增于 " + new Date(newSince).toLocaleString("zh-CN", {hour12: false}) + " 之后") : "") +
      " · 已读全文同时算已浏览；展开摘要不会自动标记";
  }

  function renderSidebar() {
    var counts = {};
    ARTICLES.forEach(function (a) {
      if (counts[a.journal] == null) counts[a.journal] = 0;
      if (matches(a, true)) counts[a.journal]++;
    });
    var order = Object.keys(counts).sort(function (x, y) { return counts[y] - counts[x]; });
    var html = '<button class="side-item' + (state.journal === "all" ? " on" : "") +
      '" data-journal="all">全部<span class="n">' + Object.keys(counts).reduce(function (n, j) { return n + counts[j]; }, 0) + "</span></button>";
    order.forEach(function (j) {
      html += '<button class="side-item' + (state.journal === j ? " on" : "") +
        '" data-journal="' + esc(j) + '">' + esc(j) + '<span class="n">' + counts[j] + "</span></button>";
    });
    document.getElementById("journalList").innerHTML = html;
  }

  // ---------------------------------------------------------------- 交互
  var searchTimer = null;
  searchBox.addEventListener("input", function () {
    clearTimeout(searchTimer);
    var value = searchBox.value.trim();
    searchTimer = setTimeout(function () {
      state.query = value;
      rebuild();
    }, 160);
  });

  document.getElementById("langSeg").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-lang]");
    if (!btn) return;
    state.lang = btn.dataset.lang;
    document.body.classList.remove("lang-both", "lang-zh", "lang-en");
    document.body.classList.add("lang-" + state.lang);
    Array.prototype.forEach.call(this.children, function (b) { b.classList.toggle("on", b === btn); });
  });

  function localDate(value) {
    return value.getFullYear() + "-" + String(value.getMonth() + 1).padStart(2, "0") + "-" + String(value.getDate()).padStart(2, "0");
  }

  function dateRangeError() {
    if (!startDateInput.value || !endDateInput.value) return "请选择完整的开始日期和结束日期";
    if (startDateInput.value > endDateInput.value) return "开始日期不能晚于结束日期";
    if (endDateInput.value > todayLocal) return "结束日期不能晚于今天";
    return "";
  }

  function syncDateControls() {
    document.getElementById("dateRangeButton").setAttribute("aria-expanded", String(!dateRange.hidden));
    document.querySelectorAll("#daySeg button").forEach(function (b) {
      b.classList.toggle("on", !dateRange.hidden ? b.dataset.days === "custom" : Number(b.dataset.days) === state.days);
    });
  }

  function applyDateRange() {
    var error = dateRangeError();
    dateRangeHint.textContent = error || "正在查看已收录论文。点击「更新文献」抓取 " + startDateInput.value + " 至 " + endDateInput.value + " 的所有期刊论文；只翻译新标题，摘要点开后按需翻译。";
    if (error) return false;
    state.startDate = startDateInput.value;
    state.endDate = endDateInput.value;
    state.days = 0;
    syncDateControls();
    rebuild();
    return true;
  }

  monthPicker.addEventListener("change", function () {
    if (!monthPicker.value) return;
    var parts = monthPicker.value.split("-");
    startDateInput.value = monthPicker.value + "-01";
    endDateInput.value = localDate(new Date(Number(parts[0]), Number(parts[1]), 0));
    if (endDateInput.value > todayLocal) endDateInput.value = todayLocal;
    applyDateRange();
  });
  [startDateInput, endDateInput].forEach(function (input) {
    input.addEventListener("change", function () { monthPicker.value = ""; applyDateRange(); });
  });

  document.getElementById("daySeg").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-days]");
    if (!btn) return;
    if (btn.dataset.days === "custom") {
      dateRange.hidden = false;
      syncDateControls();
      startDateInput.focus();
      return;
    }
    dateRange.hidden = true;
    state.startDate = state.endDate = "";
    state.days = parseInt(btn.dataset.days, 10);
    syncDateControls();
    rebuild();
  });

  document.querySelector(".sidebar").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-journal]");
    if (!btn) return;
    state.journal = btn.dataset.journal;
    rebuild();
  });

  document.getElementById("viewSeg").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-view]");
    if (!btn) return;
    state.view = btn.dataset.view;
    if (dateRange.hidden) state.days = state.view === "all" ? DEFAULT_DAYS : 0;
    syncDateControls();
    Array.prototype.forEach.call(this.children, function (b) { b.classList.toggle("on", b === btn); });
    rebuild();
  });

  document.getElementById("densitySeg").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-density]");
    if (!btn) return;
    state.density = btn.dataset.density;
    document.body.classList.toggle("compact", state.density === "compact");
    this.querySelectorAll("button").forEach(function (b) { b.classList.toggle("on", b === btn); });
    try { localStorage.setItem("papers-digest-density", state.density); } catch (e2) {}
  });

  // 主题：auto 时只挂类名让 @media 接管，light/dark 显式锁定
  function applyTheme(theme) {
    state.theme = theme;
    var html = document.documentElement;
    html.classList.remove("theme-auto", "theme-light", "theme-dark");
    html.classList.add("theme-" + theme);
    var seg = document.getElementById("themeSeg");
    if (seg) {
      Array.prototype.forEach.call(seg.children, function (b) {
        b.classList.toggle("on", b.dataset.theme === theme);
      });
    }
  }
  document.getElementById("themeSeg").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-theme]");
    if (!btn) return;
    var theme = btn.dataset.theme;
    applyTheme(theme);
    try { localStorage.setItem(THEME_KEY, theme); } catch (e2) { /* file:// 下忽略 */ }
  });

  list.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-act]");
    if (!btn) return;
    if (btn.dataset.act === "day-browsed") {
      setReading(filtered.filter(function (a) { return a.published === btn.dataset.day; }).map(function (a) { return a.doi; }), "browsed", true);
      return;
    }
    var card = btn.closest(".article");
    var doi = card.dataset.doi;
    var act = btn.dataset.act;

    if (act === "star") {
      if (state.starred.has(doi)) state.starred.delete(doi);
      else state.starred.add(doi);
      saveSet(STORE_KEY, state.starred);
      syncMarks();
      btn.classList.toggle("on", state.starred.has(doi));
      // 「已收藏」筛选下取消收藏，那张卡就该从列表里消失，得整体重排
      if (state.view === "starred") rebuild(); else updateCounts();
    } else if (act === "browse") {
      if (readingStatus(doi) !== "full") setReading([doi], readingStatus(doi) === "unread" ? "browsed" : "unread", false);
    } else if (act === "full-reading") {
      setReading([doi], readingStatus(doi) === "full" ? "browsed" : "full", false);
    } else if (act === "details") {
      var open = card.classList.toggle("open");
      btn.textContent = open ? "收起摘要" : "显示摘要";
      if (open) requestTranslation(doi, "abstract");
    } else if (act === "expand") {
      var expanded = btn.textContent === "展开摘要";
      card.querySelectorAll(".abs-zh, .abs-en, .abs-fallback").forEach(function (p) { p.classList.toggle("clamped", !expanded); });
      btn.textContent = expanded ? "收起摘要" : "展开摘要";
    } else if (act === "bibtex-one") {
      copyText(bibtexFor([find(doi)]), btn);
    } else if (act === "translate-title") {
      requestTranslation(doi, "title");
    } else if (act === "retry-abstract") {
      requestTranslation(doi, "abstract");
    }
  });

  list.addEventListener("change", function (e) {
    var box = e.target.closest("input[data-act='pick']");
    if (!box) return;
    var doi = box.closest(".article").dataset.doi;
    if (box.checked) state.selected.add(doi); else state.selected.delete(doi);
    updateCounts();
  });

  document.getElementById("actionbar").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-act]");
    if (!btn) return;
    var dois = Array.from(state.selected);
    if (btn.dataset.act === "bibtex") {
      copyText(bibtexFor(dois.map(find)), btn);
    } else if (btn.dataset.act === "browsed" || btn.dataset.act === "full") {
      setReading(dois, btn.dataset.act, true);
    } else if (btn.dataset.act === "clear") {
      state.selected.clear();
      list.querySelectorAll("input[data-act='pick']").forEach(function (b) { b.checked = false; });
      updateCounts();
    }
  });

  function find(doi) {
    for (var i = 0; i < ARTICLES.length; i++) if (ARTICLES[i].doi === doi) return ARTICLES[i];
    return null;
  }

  // ---------------------------------------------------------------- 导出
  function bibtexFor(items) {
    return items.filter(Boolean).map(function (a) {
      var first = (a.authors && a.authors[0] && a.authors[0].family) || "anon";
      var key = first.replace(/[^A-Za-z]/g, "") + (a.published || "").slice(0, 4) +
                a.doi.replace(/[^A-Za-z0-9]/g, "").slice(-4);
      var authors = (a.authors || []).map(function (x) {
        return x.family + (x.given ? ", " + x.given : "");
      }).join(" and ");
      return "@article{" + key + ",\n" +
        "  title   = {" + a.title + "},\n" +
        "  author  = {" + authors + "},\n" +
        "  journal = {" + a.journalName + "},\n" +
        "  year    = {" + (a.published || "").slice(0, 4) + "},\n" +
        (a.volume ? "  volume  = {" + a.volume + "},\n" : "") +
        (a.issue ? "  number  = {" + a.issue + "},\n" : "") +
        (a.page ? "  pages   = {" + a.page + "},\n" : "") +
        "  doi     = {" + a.doi + "},\n" +
        "  url     = {" + a.url + "}\n}";
    }).join("\n\n");
  }

  function copyText(text, btn) {
    var done = function () {
      var old = btn.textContent;
      btn.textContent = "已复制 ✓";
      setTimeout(function () { btn.textContent = old; }, 1600);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, function () { download(text, "refs.bib"); });
    } else {
      // file:// 下没有剪贴板权限，退化成下载
      download(text, "refs.bib");
      done();
    }
  }

  function download(text, filename) {
    var blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  // ---------------------------------------------------------------- 本地服务
  function flash(btn, msg, ok) {
    var old = btn.textContent;
    var short = msg.length > 26 ? msg.slice(0, 25) + "…" : msg;
    btn.textContent = short;
    btn.title = msg;   // 完整信息放 tooltip 里
    btn.disabled = true;
    setTimeout(function () { btn.textContent = old; btn.disabled = false; }, 2400);
    if (!ok) console.warn(msg);
  }

  function syncMarks() {
    if (!SERVER) return;
    fetch("/api/mark", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ starred: Array.from(state.starred) })
    }).catch(function () { /* 静默失败，localStorage 仍是权威副本 */ });
  }

  function refreshReadingCards() {
    filtered = ARTICLES.filter(matches);
    list.querySelectorAll(".article").forEach(function (card) {
      var paper = find(card.dataset.doi);
      if (!paper || !matches(paper)) { card.remove(); return; }
      var status = readingStatus(paper.doi), b = card.querySelector(".browse-toggle");
      b.classList.toggle("on", status !== "unread");
      b.setAttribute("aria-pressed", String(status !== "unread"));
      b.disabled = status === "full";
      b.textContent = status === "full" ? "✓ 已读全文" : status === "browsed" ? "✓ 已浏览" : "标为已浏览";
      b.title = status === "browsed" ? "点击恢复未浏览" : "标记为已浏览";
      card.querySelector('[data-act="full-reading"]').textContent = status === "full" ? "撤销已读全文" : "标为已读全文";
      var box = card.querySelector(".pick");
      if (box) box.checked = state.selected.has(paper.doi);
    });
    list.querySelectorAll(".day-heading").forEach(function (h) {
      if (!h.nextElementSibling || !h.nextElementSibling.classList.contains("article")) h.remove();
    });
    var displayed = Array.from(list.querySelectorAll(".article"));
    if (displayed.some(function (card, i) { return !filtered[i] || card.dataset.doi !== filtered[i].doi; })) {
      rebuild();
      return;
    }
    rendered = displayed.length;
    if (!rendered) { rebuild(); return; }
    if (rendered < Math.min(CHUNK, filtered.length)) renderChunk();
    updateCounts();
  }

  function syncReading(updates) {
    if (!SERVER || !Object.keys(updates).length) return;
    fetch("/api/reading", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({updates: updates})
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) throw new Error(d.error || "保存失败");
      mergeReading(d.reading);
      saveReadingLocal();
      refreshReadingCards();
    }).catch(function () {
      var note = document.getElementById("filterNote");
      note.textContent += " · 阅读记录已保存在本浏览器，服务端同步失败";
    });
  }

  function setReading(dois, status, batch) {
    var updates = {}, timestamp = new Date().toISOString();
    dois.forEach(function (doi) {
      // 批量已浏览不能把已读全文降级；单篇按钮允许明确更改。
      if (!(batch && status === "browsed" && readingStatus(doi) === "full")) {
        updates[doi] = {status: status, updatedAt: timestamp};
        state.reading[doi] = updates[doi];
      }
      state.selected.delete(doi);
    });
    saveReadingLocal();
    refreshReadingCards();
    syncReading(updates);
  }

  function refreshTranslationCard(a) {
    list.querySelectorAll(".article").forEach(function (card) {
      if (card.dataset.doi !== a.doi) return;
      card.querySelector(".abstracts").outerHTML = abstractBlock(a);
      var titleButton = card.querySelector('[data-act="translate-title"]');
      if (a.titleCn && titleButton) {
        var holder = document.createElement("div");
        holder.innerHTML = '<h3 class="title-cn">' + highlight(a.titleCn, state.query) +
          '</h3><p class="title-en">' + highlight(a.title, state.query) + '</p>';
        card.querySelector(".titles").replaceChildren.apply(card.querySelector(".titles"), Array.from(holder.childNodes));
        titleButton.remove();
      } else if (titleButton) {
        titleButton.disabled = !!a.titleLoading;
        titleButton.textContent = a.titleLoading ? "翻译标题中…" : "翻译标题";
      }
    });
  }

  function requestTranslation(doi, part) {
    var a = find(doi);
    if (!a) return;
    var loadingKey = part === "title" ? "titleLoading" : "abstractLoading";
    if (a[loadingKey] || (part === "title" ? a.titleCn : a.abstractCn || a.abstractUnavailable)) return;
    if (!SERVER) {
      a.abstractError = "实时翻译需要连接本地服务；已有译文仍可直接查看";
      refreshTranslationCard(a);
      return;
    }
    a[loadingKey] = true;
    a.abstractError = "";
    refreshTranslationCard(a);
    fetch("/api/translate", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({doi: doi, part: part})
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) throw new Error(d.error || "翻译失败");
      if (d.titleCn) a.titleCn = d.titleCn;
      a.abstract = d.abstract || a.abstract || "";
      a.abstractCn = d.abstractCn || a.abstractCn || "";
      a.abstractSource = d.abstractSource || a.abstractSource || "";
      if (part === "abstract") a.abstractUnavailable = !a.abstract;
    }).catch(function (error) {
      a.abstractError = "加载或翻译暂时失败：" + error.message + (a.abstract ? "；英文摘要仍可阅读" : "");
    }).finally(function () {
      a[loadingKey] = false;
      refreshTranslationCard(a);
    });
  }

  function watchUpdate(job) {
    clearTimeout(updateTimer);
    if (job.running) {
      updateStartedAt = job.startedAt;
      if (updateScopeStartedAt !== job.startedAt) {
        updateScopeStartedAt = job.startedAt;
        if (job.startDate && job.endDate) {
          dateRange.hidden = false;
          startDateInput.value = job.startDate;
          endDateInput.value = job.endDate;
          monthPicker.value = "";
          applyDateRange();
        }
      }
      updateButton.disabled = true;
      updateButton.textContent = "更新中…";
      updateProgress.textContent = job.message || "正在更新文献…";
      updateTimer = setTimeout(function () {
        fetch("/api/update").then(function (r) { return r.json(); }).then(function (d) {
          if (!d.ok) throw new Error("无法查询更新进度");
          watchUpdate(d);
        }).catch(function () {
          updateButton.disabled = false;
          updateButton.textContent = "更新文献";
          updateProgress.textContent = "更新进度连接中断；再次点击可检查或重试";
        });
      }, 1500);
      return;
    }
    updateButton.disabled = false;
    updateButton.textContent = "更新文献";
    if (job.result) showUpdate(job.result);
    if (job.error) {
      updateProgress.textContent = "更新失败：" + job.error;
      updateStartedAt = "";
    } else if (job.succeeded && updateStartedAt && job.startedAt === updateStartedAt) {
      updateProgress.textContent = "更新完成，正在加载新论文…";
      try {
        sessionStorage.setItem("papers-digest-after-update", JSON.stringify({query: state.query,
          journal: state.journal, days: state.days, view: state.view, lang: state.lang,
          startDate: state.startDate, endDate: state.endDate,
          newSince: newSince, firstVisit: firstVisit}));
      } catch (e) {}
      window.location.reload();
    }
  }

  updateButton.addEventListener("click", function () {
    if (!SERVER) {
      updateProgress.textContent = "更新文献需要连接本地阅读服务";
      return;
    }
    if (!dateRange.hidden && !applyDateRange()) {
      updateProgress.textContent = dateRangeError();
      return;
    }
    var payload = state.startDate ? {startDate: state.startDate, endDate: state.endDate} : {};
    updateButton.disabled = true;
    updateButton.textContent = "更新中…";
    updateProgress.textContent = "正在启动更新；只翻译新标题…";
    fetch("/api/update", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload)})
      .then(function (r) { return r.json(); }).then(function (d) {
        if (!d.ok) throw new Error(d.error || "无法启动更新");
        updateStartedAt = d.startedAt;
        watchUpdate(d);
      }).catch(function (error) {
        updateButton.disabled = false;
        updateButton.textContent = "更新文献";
        updateProgress.textContent = "更新失败：" + error.message;
      });
  });

  // ---------------------------------------------------------------- 启动
  function init() {
    showUpdate(META);
    try {
      var restored = JSON.parse(sessionStorage.getItem("papers-digest-after-update") || "null");
      sessionStorage.removeItem("papers-digest-after-update");
      if (restored) {
        state.query = restored.query || "";
        state.journal = restored.journal || "all";
        state.days = Number(restored.days) || 0;
        if (restored.startDate && restored.endDate) {
          dateRange.hidden = false;
          startDateInput.value = restored.startDate;
          endDateInput.value = restored.endDate;
          applyDateRange();
        }
        if (["all", "new", "unread", "browsed", "full", "starred"].indexOf(restored.view) !== -1) state.view = restored.view;
        if (["both", "zh", "en"].indexOf(restored.lang) !== -1) state.lang = restored.lang;
        newSince = restored.newSince || newSince;
        firstVisit = !!restored.firstVisit;
        searchBox.value = state.query;
        document.body.className = "lang-" + state.lang;
      }
    } catch (e) {}
    document.querySelectorAll("#viewSeg button").forEach(function (b) { b.classList.toggle("on", b.dataset.view === state.view); });
    document.querySelectorAll("#langSeg button").forEach(function (b) { b.classList.toggle("on", b.dataset.lang === state.lang); });
    syncDateControls();
    try { state.density = localStorage.getItem("papers-digest-density") === "cards" ? "cards" : "compact"; } catch (e) {}
    document.body.classList.toggle("compact", state.density === "compact");
    document.querySelectorAll("#densitySeg button").forEach(function (b) { b.classList.toggle("on", b.dataset.density === state.density); });
    if ("ResizeObserver" in window) new ResizeObserver(function (entries) {
      document.documentElement.style.setProperty("--header-height", entries[0].target.offsetHeight + "px");
    }).observe(document.querySelector(".topbar"));
    // 关闭/离开页面后才记录本次访问，当前“新增”范围在阅读期间保持不变。
    window.addEventListener("pagehide", function () {
      try {
        var latestVisit = localStorage.getItem(VISIT_KEY);
        if (!latestVisit || Date.parse(openedAt) > Date.parse(latestVisit)) localStorage.setItem(VISIT_KEY, openedAt);
      } catch (e) {}
    });
    window.addEventListener("storage", function (e) {
      if (e.key === READING_KEY && e.newValue) {
        try { mergeReading(JSON.parse(e.newValue)); refreshReadingCards(); } catch (e2) {}
      }
    });
    // 先把主题按钮状态跟 localStorage 对齐（默认 auto）
    var savedTheme = "auto";
    try {
      var t = localStorage.getItem(THEME_KEY);
      if (t === "light" || t === "dark" || t === "auto") savedTheme = t;
    } catch (e) { /* file:// 下忽略 */ }
    applyTheme(savedTheme);

    renderSidebar();
    rebuild();

    sentinel = document.createElement("div");
    sentinel.style.height = "1px";
    list.after(sentinel);
    if ("IntersectionObserver" in window) {
      new IntersectionObserver(function (entries) {
        if (entries[0].isIntersecting && rendered < filtered.length) renderChunk();
      }, { rootMargin: "600px" }).observe(sentinel);
    } else {
      window.addEventListener("scroll", function () {
        if (rendered >= filtered.length) return;
        if (window.innerHeight + window.scrollY > document.body.offsetHeight - 800) renderChunk();
      });
    }

    if (!TRANSLATED) {
      serverPill.textContent = "英文模式（未翻译）";
      serverPill.className = "stat-pill warn";
    }
    fetch("/api/health").then(function (r) { return r.json(); }).then(function (d) {
      SERVER = !!d.ok;
      serverPill.textContent = SERVER
        ? "本地服务已连接"
        : "静态模式";
      serverPill.className = "stat-pill" + (SERVER ? " ok" : " warn");
      if (SERVER) {
        // 服务端的记录和本地的取并集，避免两种模式下各记一份
        (d.starred || []).forEach(function (doi) { state.starred.add(doi); });
        saveSet(STORE_KEY, state.starred);
        mergeReading(d.reading);
        saveReadingLocal();
        if (d.update && d.update.state) showUpdate(d.update);
        if (d.updateJob && d.updateJob.running) watchUpdate(d.updateJob);
        rebuild();
        syncReading(state.reading);
      }
    }).catch(function () {
      SERVER = false;
      serverPill.textContent = "静态模式 · 更新与实时翻译需本地服务";
      serverPill.className = "stat-pill warn";
    });
  }

  init();
})();
</script>
</body>
</html>
